<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>守住四扇门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%238b4e2e' width='16' height='16'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #070605;
    overflow: hidden;
    font-family: "WenQuanYi Micro Hei", "Droid Sans Fallback", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  canvas { display: block; }
  #vignette, #hurt {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  #vignette {
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.62) 100%);
  }
  #hurt { background: rgba(140, 12, 8, 0.55); opacity: 0; }
  #cross {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border: 2px solid rgba(244, 231, 212, 0.9);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    display: none;
  }
  #cross.hot { border-color: #e2a14b; background: rgba(226, 161, 75, 0.25); }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    display: none;
    color: #f4e7d4;
  }
  #hud.show { display: block; }
  #readout {
    position: absolute;
    top: 18px;
    left: 18px;
    line-height: 1.55;
    text-shadow: 0 1px 2px #000;
  }
  #hpwrap, #stamwrap { margin-top: 8px; width: 180px; }
  #hpwrap span, #stamwrap span, #doorlist { font-size: 13px; }
  .bar { height: 8px; background: rgba(0, 0, 0, 0.55); margin-top: 3px; }
  .bar i { display: block; height: 100%; width: 0; background: #8c3b2b; }
  #stamwrap .bar i { background: #c9a15a; }
  #doorlist { position: absolute; top: 18px; right: 18px; width: 168px; text-align: left; }
  #doorlist .row { margin-bottom: 7px; }
  #doorlist .bar i { background: #6f8f4e; }
  #doorlist .row.warn .bar i { background: #c4883a; }
  #doorlist .row.bad .bar i { background: #9a2e24; }
  #prompt, #banner, #lockhint {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-shadow: 0 2px 4px #000;
  }
  #prompt { bottom: 28px; color: #e2a14b; }
  #banner { top: 16%; font-size: 32px; letter-spacing: 0.06em; color: #f0d7a4; }
  #lockhint { bottom: 64px; color: rgba(244, 231, 212, 0.8); font-size: 14px; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8, 6, 5, 0.55);
    z-index: 3;
  }
  #overlay.show { display: flex; }
  .card {
    width: min(480px, calc(100% - 32px));
    background: #2a211b;
    color: #f4e7d4;
    border: 1px solid #6d5340;
    padding: 28px 30px 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: 0.04em; }
  p { margin: 0 0 12px; line-height: 1.55; color: #cbbba6; }
  ul { margin: 0 0 16px; padding-left: 18px; line-height: 1.7; }
  #stats { margin: 0 0 14px; color: #e2a14b; font-size: 18px; }
  button {
    font: inherit;
    color: #fff8ef;
    background: #8b4e2e;
    border: 1px solid #c47a45;
    padding: 12px 22px;
    font-size: 18px;
    cursor: pointer;
  }
  button:hover, button:focus-visible { background: #a85c36; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hurt"></div>
<div id="cross"></div>
<div id="hud">
  <div id="readout">
    <div id="alive">存活 0:00</div>
    <div id="wave">第 1 波</div>
    <div id="kills">击杀 0</div>
    <div id="hpwrap"><span>生命</span><div class="bar"><i id="hpbar"></i></div></div>
    <div id="stamwrap"><span>冲刺</span><div class="bar"><i id="stambar"></i></div></div>
  </div>
  <div id="doorlist"></div>
  <div id="banner"></div>
  <div id="lockhint"></div>
  <div id="prompt">空格 / 右键 敲木板　　左键 开枪　　Shift 冲刺</div>
</div>
<div id="overlay" class="show">
  <div class="card">
    <h1 id="title">守住四扇门</h1>
    <p id="lead">这是第一人称。你站在屋子里，四个入口钉着木板。用锤子敲上去，木板有寿命，僵尸砸穿以后会从那个门进来。</p>
    <p id="stats"></p>
    <ul id="help">
      <li>点击开始后，鼠标转动视角，WASD 移动，Shift 冲刺</li>
      <li>走到门口，按住空格或右键敲木板。一块板要敲三下</li>
      <li>补过的板会一次比一次脆</li>
      <li>左键开枪，打门外的僵尸。按 F 开关手电</li>
    </ul>
    <button id="action" type="button">开始守门</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  "use strict";
  if (!window.THREE) {
    document.getElementById("lead").textContent = "三维场景没有加载出来。请重新打开这个页面。";
    return;
  }

  var ROOM_X = 5;
  var ROOM_Z = 4;
  var WALL_H = 3;
  var WALL_T = 0.28;
  var DOOR_W = 0.72;
  var EYE = 1.62;
  var PLAYER_R = 0.28;
  var ZOMBIE_R = 0.34;

  var DEFS = [
    { name: "北门", x: 0, z: -ROOM_Z, nx: 0, nz: -1 },
    { name: "东门", x: ROOM_X, z: 0, nx: 1, nz: 0 },
    { name: "南门", x: 0, z: ROOM_Z, nx: 0, nz: 1 },
    { name: "西门", x: -ROOM_X, z: 0, nx: -1, nz: 0 }
  ];

  var hurtEl = document.getElementById("hurt");
  var crossEl = document.getElementById("cross");
  var hudEl = document.getElementById("hud");
  var aliveEl = document.getElementById("alive");
  var waveEl = document.getElementById("wave");
  var killsEl = document.getElementById("kills");
  var hpBar = document.getElementById("hpbar");
  var stamBar = document.getElementById("stambar");
  var doorList = document.getElementById("doorlist");
  var bannerEl = document.getElementById("banner");
  var lockHint = document.getElementById("lockhint");
  var promptEl = document.getElementById("prompt");
  var overlay = document.getElementById("overlay");
  var titleEl = document.getElementById("title");
  var leadEl = document.getElementById("lead");
  var statsEl = document.getElementById("stats");
  var helpEl = document.getElementById("help");
  var actionEl = document.getElementById("action");

  var keys = {};
  var mouse = { left: false, right: false };
  var mode = "title";
  var doors = [];
  var zombies = [];
  var solids = [];
  var bulletTargets = [];
  var hammerTargets = [];
  var survival = 0;
  var kills = 0;
  var banner = "";
  var bannerT = 0;
  var spawnIn = 1.8;
  var houseOverrun = false;
  var yaw = 0;
  var pitch = 0;
  var recoil = 0;
  var hurtShake = 0;
  var player = null;
  var hammerTarget = null;
  var actx = null;
  var droneOn = false;
  var last = 0;
  var clock = 0;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070605);
  scene.fog = new THREE.Fog(0x070605, 9, 22);
  var camera = new THREE.PerspectiveCamera(72, 1, 0.08, 40);
  camera.rotation.order = "YXZ";
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ReinhardToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  var hemi = new THREE.HemisphereLight(0x8a8178, 0x1a120c, 0.28);
  scene.add(hemi);
  var lamp = new THREE.PointLight(0xffc48a, 0.55, 10, 2);
  lamp.position.set(0, 2.45, 0);
  scene.add(lamp);
  var flash = new THREE.SpotLight(0xffe2b8, 1.35, 16, 0.5, 0.6, 1);
  flash.position.set(0.12, -0.04, 0);
  var flashTarget = new THREE.Object3D();
  flashTarget.position.set(0, -0.05, -1);
  camera.add(flash);
  camera.add(flashTarget);
  flash.target = flashTarget;
  var muzzle = new THREE.PointLight(0xffcc88, 0, 4, 2);
  muzzle.position.set(0.16, -0.12, -0.4);
  camera.add(muzzle);
  scene.add(camera);

  var view = new THREE.Group();
  camera.add(view);
  var gun = new THREE.Group();
  var metal = new THREE.MeshStandardMaterial({ color: 0x2a2724, roughness: 0.45, metalness: 0.6 });
  var barrel = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.035, 0.28), metal);
  barrel.position.set(0.22, -0.2, -0.38);
  var stock = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.07, 0.12), metal);
  stock.position.set(0.22, -0.22, -0.22);
  gun.add(barrel, stock);
  view.add(gun);
  var hammerPivot = new THREE.Group();
  hammerPivot.position.set(0.32, -0.24, -0.42);
  var handleMat = new THREE.MeshStandardMaterial({ color: 0x8a5a32, roughness: 0.8 });
  var handle = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.26, 0.035), handleMat);
  var head = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.05), metal);
  head.position.y = 0.14;
  hammerPivot.add(handle, head);
  view.add(hammerPivot);

  function paintTexture(draw) {
    var canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;
    draw(canvas.getContext("2d"));
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  var floorTex = paintTexture(function (g) {
    g.fillStyle = "#5a4030";
    g.fillRect(0, 0, 256, 256);
    var i;
    for (i = 0; i < 14; i++) {
      g.fillStyle = i % 2 ? "#4a3426" : "#684832";
      g.fillRect(0, i * 18, 256, 16);
      g.strokeStyle = "rgba(30,16,8,0.35)";
      g.strokeRect(0, i * 18, 256, 16);
    }
  });
  floorTex.repeat.set(4, 3);
  var wallTex = paintTexture(function (g) {
    g.fillStyle = "#6d6258";
    g.fillRect(0, 0, 256, 256);
    var y;
    for (y = 0; y < 256; y += 32) {
      g.fillStyle = y % 64 === 0 ? "#5e554c" : "#756a60";
      g.fillRect(0, y, 256, 28);
      g.fillStyle = "rgba(40,30,24,0.25)";
      g.fillRect(0, y + 27, 256, 3);
    }
  });
  wallTex.repeat.set(2, 1);
  var plankTex = paintTexture(function (g) {
    g.fillStyle = "#8d5c34";
    g.fillRect(0, 0, 256, 64);
    g.strokeStyle = "rgba(50,24,8,0.45)";
    var x;
    for (x = 0; x < 256; x += 7) {
      g.beginPath();
      g.moveTo(x, 0);
      g.lineTo(x + 2, 64);
      g.stroke();
    }
    g.fillStyle = "#d9d0c6";
    g.fillRect(18, 26, 8, 8);
    g.fillRect(230, 26, 8, 8);
  });

  var floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 });
  var wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.92 });
  var outMat = new THREE.MeshStandardMaterial({ color: 0x1c1914, roughness: 1 });
  var ceilMat = new THREE.MeshStandardMaterial({ color: 0x2a241e, roughness: 1 });

  var floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), outMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  var insideFloor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_X * 2, ROOM_Z * 2), floorMat);
  insideFloor.rotation.x = -Math.PI / 2;
  insideFloor.position.y = 0.02;
  scene.add(insideFloor);
  var ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_X * 2 + 0.2, ROOM_Z * 2 + 0.2), ceilMat);
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = WALL_H;
  scene.add(ceiling);

  function addSolid(mesh, door) {
    mesh.updateMatrixWorld();
    var box = new THREE.Box3().setFromObject(mesh);
    solids.push({
      minX: box.min.x,
      maxX: box.max.x,
      minZ: box.min.z,
      maxZ: box.max.z,
      door: door || null
    });
  }

  function addWall(w, h, d, x, y, z, collide) {
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    bulletTargets.push(mesh);
    if (collide !== false) addSolid(mesh, null);
    return mesh;
  }

  function buildShell() {
    var y = WALL_H / 2;
    var northZ = -ROOM_Z - WALL_T / 2;
    var southZ = ROOM_Z + WALL_T / 2;
    var eastX = ROOM_X + WALL_T / 2;
    var westX = -ROOM_X - WALL_T / 2;
    var sideW = ROOM_X - DOOR_W;
    var sideD = ROOM_Z - DOOR_W;
    addWall(sideW, WALL_H, WALL_T, -(DOOR_W + ROOM_X) / 2, y, northZ);
    addWall(sideW, WALL_H, WALL_T, (DOOR_W + ROOM_X) / 2, y, northZ);
    addWall(sideW, WALL_H, WALL_T, -(DOOR_W + ROOM_X) / 2, y, southZ);
    addWall(sideW, WALL_H, WALL_T, (DOOR_W + ROOM_X) / 2, y, southZ);
    addWall(WALL_T, WALL_H, sideD, eastX, y, -(DOOR_W + ROOM_Z) / 2);
    addWall(WALL_T, WALL_H, sideD, eastX, y, (DOOR_W + ROOM_Z) / 2);
    addWall(WALL_T, WALL_H, sideD, westX, y, -(DOOR_W + ROOM_Z) / 2);
    addWall(WALL_T, WALL_H, sideD, westX, y, (DOOR_W + ROOM_Z) / 2);

    var lintelH = WALL_H - 2.4;
    var lintelY = 2.4 + lintelH / 2;
    addWall(DOOR_W * 2, lintelH, WALL_T, 0, lintelY, northZ, false);
    addWall(DOOR_W * 2, lintelH, WALL_T, 0, lintelY, southZ, false);
    addWall(WALL_T, lintelH, DOOR_W * 2, eastX, lintelY, 0, false);
    addWall(WALL_T, lintelH, DOOR_W * 2, westX, lintelY, 0, false);

    var crate = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.55, 0.7), handleMat);
    crate.position.set(3.1, 0.28, 2.2);
    scene.add(crate);
    var crate2 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 0.45), handleMat);
    crate2.position.set(-3.2, 0.22, -1.8);
    scene.add(crate2);
  }

  function makeDoor(def) {
    var pivot = new THREE.Group();
    pivot.position.set(def.x, 0, def.z);
    scene.add(pivot);
    var boards = [];
    var i;
    for (i = 0; i < 3; i++) {
      var horizontal = Math.abs(def.nx) < 0.5;
      var geo = horizontal ? new THREE.BoxGeometry(1.32, 0.18, 0.08) : new THREE.BoxGeometry(0.08, 0.18, 1.32);
      var mat = new THREE.MeshStandardMaterial({ map: plankTex, roughness: 0.78, color: 0xffffff });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(-def.nx * 0.05, 0.46 + i * 0.64, -def.nz * 0.05);
      mesh.userData.doorIndex = doors.length;
      pivot.add(mesh);
      hammerTargets.push(mesh);
      boards.push({ life: 96, max: 96, gen: 0, mesh: mesh, tilt: i % 2 ? 1 : -1 });
    }
    var sensorGeo = new THREE.BoxGeometry(
      Math.abs(def.nx) > 0.5 ? 0.35 : 1.35,
      2.15,
      Math.abs(def.nz) > 0.5 ? 0.35 : 1.35
    );
    var sensor = new THREE.Mesh(sensorGeo, new THREE.MeshBasicMaterial({
      transparent: true,
      opacity: 0,
      depthWrite: false
    }));
    sensor.position.y = 1.15;
    sensor.userData.doorIndex = doors.length;
    pivot.add(sensor);
    hammerTargets.push(sensor);
    var door = {
      name: def.name,
      x: def.x,
      z: def.z,
      nx: def.nx,
      nz: def.nz,
      boards: boards,
      pivot: pivot,
      shake: 0,
      wasOpen: false,
      alarm: 0
    };
    var depth = WALL_T + 0.12;
    solids.push({
      minX: def.x - (Math.abs(def.nx) > 0.5 ? depth / 2 : DOOR_W),
      maxX: def.x + (Math.abs(def.nx) > 0.5 ? depth / 2 : DOOR_W),
      minZ: def.z - (Math.abs(def.nz) > 0.5 ? depth / 2 : DOOR_W),
      maxZ: def.z + (Math.abs(def.nz) > 0.5 ? depth / 2 : DOOR_W),
      door: door
    });
    return door;
  }

  function isOpen(door) {
    var i;
    for (i = 0; i < door.boards.length; i++) if (door.boards[i].life > 0) return false;
    return true;
  }

  function integrity(door) {
    var life = 0;
    var max = 0;
    var i;
    for (i = 0; i < door.boards.length; i++) {
      life += door.boards[i].life;
      max += door.boards[i].max;
    }
    return max > 0 ? life / max : 0;
  }

  function intactCount(door) {
    var n = 0;
    var i;
    for (i = 0; i < door.boards.length; i++) if (door.boards[i].life > 0) n++;
    return n;
  }

  function canRepair(door) {
    var i;
    for (i = 0; i < door.boards.length; i++) if (door.boards[i].life < door.boards[i].max) return true;
    return false;
  }

  function refreshBoard(board) {
    var p = board.max > 0 ? board.life / board.max : 0;
    board.mesh.visible = board.life > 0;
    board.mesh.scale.y = 0.45 + 0.55 * p;
    board.mesh.rotation.z = (1 - p) * 0.22 * board.tilt;
    var worn = Math.max(0.55, 1 - board.gen * 0.1);
    board.mesh.material.color.setRGB((0.55 + p * 0.45) * worn, (0.32 + p * 0.2) * worn, 0.16 * worn);
  }

  function wave() {
    return 1 + Math.floor(survival / 28) + Math.floor(kills / 8);
  }

  function boardDamage() {
    return 11 + (wave() - 1) * 4;
  }

  function fmt(t) {
    var s = Math.max(0, Math.floor(t));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function bestTime() {
    try { return parseFloat(localStorage.getItem("hold-doors-best") || "0") || 0; }
    catch (e) { return 0; }
  }

  function saveBest() {
    try {
      if (survival > bestTime()) localStorage.setItem("hold-doors-best", String(survival));
    } catch (e) {}
  }

  function blocked(x, z, r) {
    if (Math.abs(x) > 15.5 || Math.abs(z) > 15.5) return true;
    var i;
    for (i = 0; i < solids.length; i++) {
      var s = solids[i];
      if (s.door && isOpen(s.door)) continue;
      var px = Math.max(s.minX, Math.min(x, s.maxX));
      var pz = Math.max(s.minZ, Math.min(z, s.maxZ));
      var dx = x - px;
      var dz = z - pz;
      if (dx * dx + dz * dz < r * r) return true;
    }
    return false;
  }

  function moveBody(body, dx, dz, r) {
    if (!blocked(body.x + dx, body.z, r)) body.x += dx;
    if (!blocked(body.x, body.z + dz, r)) body.z += dz;
  }

  function insideHouse(x, z) {
    return Math.abs(x) < ROOM_X - 0.4 && Math.abs(z) < ROOM_Z - 0.4;
  }

  function startAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === "suspended") actx.resume();
    if (droneOn) return;
    droneOn = true;
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = "sine";
    o.frequency.value = 48;
    g.gain.value = 0.02;
    o.connect(g);
    g.connect(actx.destination);
    o.start();
  }

  function tone(freq, dur, type, gain, slide) {
    if (!actx) return;
    var o = actx.createOscillator();
    var g = actx.createGain();
    var t = actx.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function noise(dur, gain, freq) {
    if (!actx) return;
    var length = Math.max(1, Math.floor(actx.sampleRate * dur));
    var buffer = actx.createBuffer(1, length, actx.sampleRate);
    var data = buffer.getChannelData(0);
    var i;
    for (i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    var src = actx.createBufferSource();
    src.buffer = buffer;
    var filter = actx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = freq;
    var g = actx.createGain();
    var t = actx.currentTime;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filter);
    filter.connect(g);
    g.connect(actx.destination);
    src.start(t);
  }

  function sndKnock() { noise(0.07, 0.25, 380); tone(110, 0.08, "square", 0.05, 50); }
  function sndShot() { noise(0.05, 0.2, 2400); tone(220, 0.05, "square", 0.04, 70); }
  function sndCrack() { noise(0.18, 0.3, 650); tone(150, 0.14, "sawtooth", 0.045, 42); }
  function sndHurt() { tone(210, 0.14, "sawtooth", 0.06, 60); }
  function sndBite() { noise(0.09, 0.14, 480); tone(80, 0.1, "sawtooth", 0.04, 40); }

  function announce(text) {
    banner = text;
    bannerT = 2.1;
  }

  function refreshAll(door) {
    var i;
    for (i = 0; i < door.boards.length; i++) refreshBoard(door.boards[i]);
  }

  function syncDoors() {
    var anySealed = false;
    var i;
    for (i = 0; i < doors.length; i++) {
      var door = doors[i];
      var open = isOpen(door);
      refreshAll(door);
      if (open !== door.wasOpen) {
        if (open) {
          announce(door.name + "破了");
          hurtShake = Math.max(hurtShake, 0.7);
          sndCrack();
        } else {
          announce(door.name + "钉上了");
        }
        door.wasOpen = open;
      }
      if (!open) anySealed = true;
    }
    if (!anySealed && !houseOverrun && survival > 0.2) {
      houseOverrun = true;
      announce("他们进来了");
    }
    if (anySealed) houseOverrun = false;
  }

  function repair(door, amount) {
    var target = null;
    var i;
    for (i = door.boards.length - 1; i >= 0; i--) {
      if (door.boards[i].life <= 0) { target = door.boards[i]; break; }
    }
    if (!target) {
      var lowest = 1e9;
      for (i = 0; i < door.boards.length; i++) {
        var board = door.boards[i];
        if (board.life < board.max && board.life < lowest) {
          lowest = board.life;
          target = board;
        }
      }
    }
    if (!target) return 0;
    var before = target.life;
    var maxBefore = target.max;
    if (target.life <= 0) {
      target.gen += 1;
      target.max = Math.max(48, 96 - target.gen * 12);
      target.life = 0;
    }
    target.life = Math.min(target.max, target.life + amount);
    syncDoors();
    return target.life >= target.max && before < maxBefore ? 2 : 1;
  }

  function hurtDoor(door, amount) {
    var remain = amount;
    var broke = false;
    while (remain > 0) {
      var target = null;
      var i;
      for (i = door.boards.length - 1; i >= 0; i--) {
        if (door.boards[i].life > 0) { target = door.boards[i]; break; }
      }
      if (!target) break;
      var spent = Math.min(target.life, remain);
      target.life -= spent;
      remain -= spent;
      if (target.life <= 0) {
        target.life = 0;
        broke = true;
      }
    }
    door.shake = 0.32;
    door.alarm = 1;
    if (broke) sndCrack();
    else sndBite();
    syncDoors();
  }

  function makeZombie(x, z) {
    var group = new THREE.Group();
    var skin = new THREE.MeshStandardMaterial({ color: 0x3f4a34, roughness: 0.9 });
    var body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.62, 0.24), skin);
    body.position.y = 1.05;
    var head = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.26, 0.24), skin);
    head.position.y = 1.55;
    var eye = new THREE.MeshBasicMaterial({ color: 0xff2a1a });
    var eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.04, 0.02), eye);
    var eyeR = eyeL.clone();
    eyeL.position.set(-0.06, 1.57, 0.12);
    eyeR.position.set(0.06, 1.57, 0.12);
    var legMat = skin.clone();
    var legL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, 0.12), legMat);
    var legR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, 0.12), legMat.clone());
    legL.position.set(-0.1, 0.28, 0);
    legR.position.set(0.1, 0.28, 0);
    legL.geometry.translate(0, -0.2, 0);
    legR.geometry.translate(0, -0.2, 0);
    group.add(body, head, eyeL, eyeR, legL, legR);
    group.position.set(x, 0, z);
    scene.add(group);
    var maxHp = 46 + wave() * 10;
    var zombie = {
      mesh: group,
      x: x,
      z: z,
      hp: maxHp,
      max: maxHp,
      speed: 1.35 + wave() * 0.12 + Math.random() * 0.35,
      hitCd: 0.4 + Math.random() * 0.4,
      hurt: 0,
      dead: false,
      stuck: 0,
      lx: x,
      lz: z,
      bob: Math.random() * 6,
      legL: legL,
      legR: legR,
      body: body
    };
    body.userData.zombie = zombie;
    head.userData.zombie = zombie;
    bulletTargets.push(body, head);
    return zombie;
  }

  function spawnZombie(door) {
    var tx = -door.nz;
    var tz = door.nx;
    var lateral = (Math.random() - 0.5) * 3.4;
    var dist = 4.2 + Math.random() * 1.4;
    var z = makeZombie(
      door.x + door.nx * dist + tx * lateral,
      door.z + door.nz * dist + tz * lateral
    );
    z.x = Math.max(-14, Math.min(14, z.x));
    z.z = Math.max(-14, Math.min(14, z.z));
    z.mesh.position.x = z.x;
    z.mesh.position.z = z.z;
    zombies.push(z);
  }

  function think(z) {
    if (insideHouse(z.x, z.z)) return { mode: "chase", nx: 0, nz: 0 };
    var sealed = null;
    var open = null;
    var sealedD = 1e9;
    var openD = 1e9;
    var i;
    for (i = 0; i < doors.length; i++) {
      var door = doors[i];
      var dx = z.x - door.x;
      var dz = z.z - door.z;
      var d = Math.hypot(dx, dz);
      var outside = dx * door.nx + dz * door.nz > 0.35;
      if (!outside && d > 1.8) continue;
      if (isOpen(door)) {
        if (d < openD) { openD = d; open = door; }
      } else if (d < sealedD) {
        sealedD = d;
        sealed = door;
      }
    }
    if (open && !(sealed && sealedD + 2.2 < openD)) return { mode: "enter", door: open, nx: open.nx, nz: open.nz };
    if (sealed) return { mode: "bash", door: sealed, nx: sealed.nx, nz: sealed.nz };
    return { mode: "chase", nx: 0, nz: 0 };
  }

  function steer(z, tx, tz, dt) {
    var dx = tx - z.x;
    var dz = tz - z.z;
    var i;
    for (i = 0; i < zombies.length; i++) {
      var o = zombies[i];
      if (o === z || o.dead) continue;
      var ox = z.x - o.x;
      var oz = z.z - o.z;
      var d = Math.hypot(ox, oz);
      if (d > 0 && d < 0.7) {
        dx += (ox / d) * 0.55;
        dz += (oz / d) * 0.55;
      }
    }
    var len = Math.hypot(dx, dz) || 1;
    moveBody(z, (dx / len) * z.speed * dt, (dz / len) * z.speed * dt, ZOMBIE_R);
    z.mesh.position.x = z.x;
    z.mesh.position.z = z.z;
    z.mesh.rotation.y = Math.atan2(dx, dz);
    z.bob += dt * z.speed * 7;
    var swing = Math.sin(z.bob) * 0.55;
    z.legL.rotation.x = swing;
    z.legR.rotation.x = -swing;
  }

  function damagePlayer(amount, fromX, fromZ) {
    if (mode !== "play" || player.inv > 0) return;
    player.hp = Math.max(0, player.hp - amount);
    player.inv = 0.45;
    player.hurt = 1;
    hurtShake = 1;
    sndHurt();
    var dx = player.x - fromX;
    var dz = player.z - fromZ;
    var len = Math.hypot(dx, dz) || 1;
    moveBody(player, (dx / len) * 0.35, (dz / len) * 0.35, PLAYER_R);
    if (player.hp <= 0) die();
  }

  function chase(z, dt) {
    var d = Math.hypot(player.x - z.x, player.z - z.z);
    if (d < 0.85) {
      if (z.hitCd <= 0) {
        z.hitCd = 0.9;
        damagePlayer(8 + Math.floor(wave() / 2), z.x, z.z);
        sndBite();
      }
      z.mesh.rotation.y = Math.atan2(player.x - z.x, player.z - z.z);
      return;
    }
    steer(z, player.x, player.z, dt);
  }

  function shoot() {
    var ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(0, 0), camera);
    var hits = ray.intersectObjects(bulletTargets, false);
    muzzle.intensity = 6;
    sndShot();
    recoil = Math.min(0.09, recoil + 0.035);
    player.kick = 1;
    var i;
    for (i = 0; i < hits.length; i++) {
      var zed = hits[i].object.userData.zombie;
      if (zed && zed.dead) continue;
      if (!zed) return;
      var z = zed;
      z.hp -= 22;
      z.hurt = 1;
      z.body.material.emissive = new THREE.Color(0x662222);
      if (z.hp <= 0) {
        z.dead = true;
        z.mesh.rotation.x = -Math.PI / 2;
        z.mesh.position.y = 0.35;
        kills += 1;
      }
      return;
    }
  }

  function lookDoor() {
    var ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(0, 0), camera);
    var hits = ray.intersectObjects(hammerTargets, false);
    if (!hits.length || hits[0].distance > 2.5) return null;
    var index = hits[0].object.userData.doorIndex;
    var door = doors[index];
    if (!door || !canRepair(door)) return null;
    return door;
  }

  function die() {
    if (mode !== "play") return;
    mode = "dead";
    player.hp = 0;
    saveBest();
    if (document.pointerLockElement) document.exitPointerLock();
    titleEl.textContent = "没守住";
    leadEl.textContent = "木板断了，门开了，他们进来了。";
    statsEl.hidden = false;
    statsEl.textContent = "存活 " + fmt(survival) + "    击杀 " + kills + "    最佳 " + fmt(bestTime());
    helpEl.hidden = true;
    actionEl.textContent = "再守一次";
    overlay.classList.add("show");
    crossEl.style.display = "none";
  }

  function showTitle() {
    mode = "title";
    titleEl.textContent = "守住四扇门";
    leadEl.textContent = "这是第一人称。你站在屋子里，四个入口钉着木板。用锤子敲上去，木板有寿命，僵尸砸穿以后会从那个门进来。";
    var best = bestTime();
    statsEl.hidden = best <= 0;
    statsEl.textContent = best > 0 ? "最佳 " + fmt(best) : "";
    helpEl.hidden = false;
    actionEl.textContent = "开始守门";
    overlay.classList.add("show");
    hudEl.classList.remove("show");
    crossEl.style.display = "none";
  }

  function applyLook() {
    pitch = Math.max(-1.25, Math.min(1.15, pitch));
    camera.rotation.y = yaw;
    camera.rotation.x = pitch - recoil;
    camera.rotation.z = Math.sin(clock * 42) * hurtShake * 0.03;
  }

  function update(dt) {
    clock += dt;
    survival += dt;
    player.inv = Math.max(0, player.inv - dt);
    player.hurt = Math.max(0, player.hurt - dt * 1.5);
    player.hammerCd = Math.max(0, player.hammerCd - dt);
    player.fireCd = Math.max(0, player.fireCd - dt);
    player.swing = Math.max(0, player.swing - dt * 3.1);
    recoil = Math.max(0, recoil - dt * 0.45);
    hurtShake = Math.max(0, hurtShake - dt * 1.4);
    bannerT = Math.max(0, bannerT - dt);
    muzzle.intensity = Math.max(0, muzzle.intensity - dt * 30);
    player.kick = Math.max(0, player.kick - dt * 6);

    var forwardX = -Math.sin(yaw);
    var forwardZ = -Math.cos(yaw);
    var rightX = Math.cos(yaw);
    var rightZ = -Math.sin(yaw);
    var ix = 0;
    var iz = 0;
    if (keys.KeyW || keys.ArrowUp) { ix += forwardX; iz += forwardZ; }
    if (keys.KeyS || keys.ArrowDown) { ix -= forwardX; iz -= forwardZ; }
    if (keys.KeyD || keys.ArrowRight) { ix += rightX; iz += rightZ; }
    if (keys.KeyA || keys.ArrowLeft) { ix -= rightX; iz -= rightZ; }
    var moving = ix !== 0 || iz !== 0;
    var sprint = moving && (keys.ShiftLeft || keys.ShiftRight) && player.stamina > 1;
    if (sprint) player.stamina = Math.max(0, player.stamina - 30 * dt);
    else player.stamina = Math.min(100, player.stamina + 18 * dt);
    var len = Math.hypot(ix, iz);
    if (len > 0) {
      var speed = sprint ? 5.3 : 3.35;
      moveBody(player, (ix / len) * speed * dt, (iz / len) * speed * dt, PLAYER_R);
    }
    var bob = moving ? Math.sin(clock * (sprint ? 11 : 8)) * 0.035 : 0;
    camera.position.set(player.x, EYE + bob, player.z);
    applyLook();
    gun.position.z = -player.kick * 0.06;
    hammerPivot.rotation.x = -0.5 + (1 - player.swing) * 1.7;
    hammerPivot.visible = player.swing > 0.02;
    gun.visible = player.swing <= 0.02;
    flash.intensity = player.lightOff ? 0 : 1.35;

    camera.updateMatrixWorld();
    hammerTarget = lookDoor();
    var hammering = keys.Space || keys.KeyE || mouse.right;
    if (hammering && hammerTarget && player.hammerCd <= 0) {
      var result = repair(hammerTarget, 32);
      player.hammerCd = 0.33;
      player.swing = 1;
      hurtShake = Math.max(hurtShake, 0.25);
      sndKnock();
      hammerTarget.shake = Math.max(hammerTarget.shake, 0.2);
      if (result === 2) {
        var frail = false;
        var b;
        for (b = 0; b < hammerTarget.boards.length; b++) if (hammerTarget.boards[b].gen >= 3) frail = true;
        announce(frail ? "木板变脆了" : hammerTarget.name + "钉上了");
      }
    }
    if (mouse.left && player.fireCd <= 0 && player.swing < 0.15) {
      player.fireCd = 0.22;
      shoot();
    }

    var i;
    for (i = 0; i < doors.length; i++) {
      var door = doors[i];
      door.shake = Math.max(0, door.shake - dt);
      door.alarm = Math.max(0, door.alarm - dt);
      var jolt = Math.sin(door.shake * 60) * door.shake * 0.06;
      door.pivot.position.set(door.x + jolt, 0, door.z);
    }

    var w = wave();
    var cap = Math.min(14, 4 + w * 2);
    spawnIn -= dt;
    var alive = 0;
    for (i = 0; i < zombies.length; i++) if (!zombies[i].dead) alive++;
    if (spawnIn <= 0 && alive < cap) {
      spawnIn = Math.max(0.55, 2.2 - w * 0.15);
      var pick = doors[Math.floor(Math.random() * doors.length)];
      if (Math.random() < 0.45) {
        var weak = pick;
        var weakLife = 2;
        for (i = 0; i < doors.length; i++) {
          var life = integrity(doors[i]);
          if (life < weakLife) { weakLife = life; weak = doors[i]; }
        }
        pick = weak;
      }
      spawnZombie(pick);
    }

    for (i = zombies.length - 1; i >= 0; i--) {
      var z = zombies[i];
      z.hurt = Math.max(0, z.hurt - dt * 3);
      if (z.hurt <= 0 && z.body.material.emissive) z.body.material.emissive.setHex(0x000000);
      if (z.dead) {
        z.fade = (z.fade || 6) - dt;
        if (z.fade <= 0) {
          scene.remove(z.mesh);
          bulletTargets = bulletTargets.filter(function (mesh) { return mesh.userData.zombie !== z; });
          zombies.splice(i, 1);
        }
        continue;
      }
      z.hitCd -= dt;
      var order = think(z);
      var holding = false;
      if (order.mode === "bash") {
        var ax = order.door.x + order.door.nx * 1.15;
        var az = order.door.z + order.door.nz * 1.15;
        var dd = Math.hypot(z.x - order.door.x, z.z - order.door.z);
        var gd = Math.hypot(z.x - ax, z.z - az);
        if (gd > 0.45 && dd > 1.35) steer(z, ax, az, dt);
        else {
          holding = true;
          z.mesh.rotation.y = Math.atan2(-order.door.nx, -order.door.nz);
          z.mesh.position.y = Math.abs(Math.sin(clock * 8 + i)) * 0.06;
          if (z.hitCd <= 0) {
            z.hitCd = 0.78 + Math.random() * 0.18;
            hurtDoor(order.door, boardDamage());
          }
        }
      } else if (order.mode === "enter") {
        z.mesh.position.y = 0;
        if (!insideHouse(z.x, z.z)) steer(z, order.door.x - order.door.nx * 1.15, order.door.z - order.door.nz * 1.15, dt);
        else chase(z, dt);
        if (Math.hypot(player.x - z.x, player.z - z.z) < 0.85) holding = true;
      } else {
        z.mesh.position.y = 0;
        chase(z, dt);
        if (Math.hypot(player.x - z.x, player.z - z.z) < 0.85) holding = true;
      }
      var moved = Math.hypot(z.x - z.lx, z.z - z.lz);
      if (!holding && moved < 0.15 * dt) z.stuck += dt;
      else z.stuck = 0;
      z.lx = z.x;
      z.lz = z.z;
      if (z.stuck > 0.7) {
        z.stuck = 0;
        var side = Math.random() < 0.5 ? 1 : -1;
        var sx = -(order.nz || 0) * 0.45 * side;
        var sz = (order.nx || 0) * 0.45 * side;
        if (!sx && !sz) { sx = (Math.random() - 0.5); sz = (Math.random() - 0.5); }
        moveBody(z, sx, sz, ZOMBIE_R);
        z.mesh.position.x = z.x;
        z.mesh.position.z = z.z;
      }
    }
  }

  function renderHud() {
    aliveEl.textContent = "存活  " + fmt(survival);
    waveEl.textContent = "第 " + wave() + " 波";
    killsEl.textContent = "击杀  " + kills;
    hpBar.style.width = (player.hp / player.max * 100) + "%";
    hpBar.style.background = player.hp < 35 ? "#9a2e24" : "#8c3b2b";
    stamBar.style.width = player.stamina + "%";
    hurtEl.style.opacity = String(player.hurt * 0.65);
    bannerEl.textContent = bannerT > 0 ? banner : "";
    bannerEl.style.opacity = String(Math.min(1, bannerT));
    crossEl.className = hammerTarget ? "hot" : "";
    lockHint.textContent = document.pointerLockElement ? "" : "点击画面锁定鼠标";
    if (hammerTarget) {
      promptEl.textContent = "敲 " + hammerTarget.name + "   " + Math.round(integrity(hammerTarget) * 100) + "%";
    } else {
      promptEl.textContent = "空格 / 右键 敲木板　　左键 开枪　　Shift 冲刺";
    }
    var html = "";
    var i;
    for (i = 0; i < doors.length; i++) {
      var door = doors[i];
      var open = isOpen(door);
      var life = integrity(door);
      var cls = open || life < 0.34 ? "bad" : life < 0.66 || door.alarm > 0 ? "warn" : "";
      html += '<div class="row ' + cls + '"><div>' + (open ? door.name + "  破了" : door.name + "  " + intactCount(door) + "/3") + '</div><div class="bar"><i style="width:' + (open ? 0 : life * 100) + '%"></i></div></div>';
    }
    doorList.innerHTML = html;
  }

  function resize() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }

  function reset() {
    var i;
    for (i = 0; i < zombies.length; i++) scene.remove(zombies[i].mesh);
    zombies = [];
    for (i = 0; i < doors.length; i++) scene.remove(doors[i].pivot);
    doors = [];
    hammerTargets = [];
    solids = solids.filter(function (s) { return !s.door; });
    for (i = 0; i < DEFS.length; i++) doors.push(makeDoor(DEFS[i]));
    player = {
      x: 0,
      z: 1.2,
      hp: 100,
      max: 100,
      stamina: 100,
      inv: 0,
      hurt: 0,
      fireCd: 0,
      hammerCd: 0,
      swing: 0,
      kick: 0,
      lightOff: false
    };
    survival = 0;
    kills = 0;
    banner = "守住四扇门";
    bannerT = 2.4;
    spawnIn = 1.8;
    houseOverrun = false;
    yaw = 0;
    pitch = 0;
    recoil = 0;
    hurtShake = 0;
    camera.position.set(player.x, EYE, player.z);
    applyLook();
    syncDoors();
    doors.forEach(function (door) { door.wasOpen = false; });
  }

  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (mode === "play") update(dt);
    if (player) renderHud();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    if (e.code === "KeyF" && mode === "play") player.lightOff = !player.lightOff;
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () {
    keys = {};
    mouse.left = false;
    mouse.right = false;
  });
  renderer.domElement.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  renderer.domElement.addEventListener("mousedown", function (e) {
    if (mode !== "play") return;
    if (!document.pointerLockElement) renderer.domElement.requestPointerLock();
    if (e.button === 0) mouse.left = true;
    if (e.button === 2) mouse.right = true;
  });
  window.addEventListener("mouseup", function (e) {
    if (e.button === 0) mouse.left = false;
    if (e.button === 2) mouse.right = false;
  });
  document.addEventListener("mousemove", function (e) {
    if (mode !== "play") return;
    if (document.pointerLockElement !== renderer.domElement) return;
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
  });

  actionEl.addEventListener("click", function () {
    startAudio();
    reset();
    mode = "play";
    overlay.classList.remove("show");
    hudEl.classList.add("show");
    crossEl.style.display = "block";
    renderer.domElement.requestPointerLock();
  });

  buildShell();
  reset();
  showTitle();
  resize();
  requestAnimationFrame(frame);

  window.__game = {
    snapshot: function () {
      return {
        mode: mode,
        survival: survival,
        kills: kills,
        hp: player.hp,
        x: player.x,
        z: player.z,
        yaw: yaw,
        zombies: zombies.filter(function (z) { return !z.dead; }).length,
        inside: zombies.filter(function (z) { return !z.dead && insideHouse(z.x, z.z); }).length,
        doors: doors.map(function (door) {
          return {
            name: door.name,
            open: isOpen(door),
            integrity: integrity(door),
            boards: door.boards.map(function (b) { return { life: b.life, max: b.max, gen: b.gen }; })
          };
        })
      };
    },
    hurtDoor: function (index, amount) { hurtDoor(doors[index], amount); },
    place: function (x, z) { player.x = x; player.z = z; camera.position.set(x, EYE, z); },
    look: function (nextYaw, nextPitch) { yaw = nextYaw; pitch = nextPitch || 0; applyLook(); },
    hitPlayer: function (amount) { damagePlayer(amount || 100, player.x, player.z + 1); },
    free: function (x, z) { return !blocked(x, z, PLAYER_R); }
  };
})();
</script>
</body>
</html>
