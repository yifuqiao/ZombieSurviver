<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>守住四扇门</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%238b4e2e' width='16' height='16'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --ink: #f4e7d4;
    --muted: #cbbba6;
    --card: #2a211b;
    --line: #6d5340;
    --amber: #e2a14b;
    --wood: #8b4e2e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0e0c0a;
    overflow: hidden;
    font-family: "WenQuanYi Micro Hei", "Droid Sans Fallback", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8, 6, 5, 0.62);
    z-index: 2;
  }
  #overlay.show { display: flex; }
  .card {
    width: min(460px, calc(100% - 32px));
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 28px 30px 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  p { margin: 0 0 12px; line-height: 1.55; color: var(--muted); }
  ul { margin: 0 0 16px; padding-left: 18px; line-height: 1.7; }
  #stats { margin: 0 0 14px; color: var(--amber); font-size: 18px; }
  button {
    font: inherit;
    color: #fff8ef;
    background: var(--wood);
    border: 1px solid #c47a45;
    padding: 10px 18px;
    cursor: pointer;
  }
  button:hover, button:focus-visible { background: #a85c36; }
  #action { font-size: 18px; padding: 12px 22px; }
  #hud-controls {
    position: fixed;
    z-index: 1;
    left: 16px;
    bottom: 16px;
    display: none;
    gap: 8px;
    align-items: end;
  }
  #hud-controls.show { display: flex; }
  #pad { display: grid; gap: 6px; justify-items: center; }
  #pad .row { display: flex; gap: 6px; }
  #pad button, #hammer {
    width: 52px;
    height: 52px;
    font-size: 20px;
    padding: 0;
  }
  #hammer {
    width: auto;
    min-width: 108px;
    height: 52px;
    padding: 0 16px;
    font-size: 16px;
  }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="hud-controls">
  <div id="pad" aria-label="移动">
    <button type="button" data-key="KeyW" aria-label="向上">↑</button>
    <div class="row">
      <button type="button" data-key="KeyA" aria-label="向左">←</button>
      <button type="button" data-key="KeyS" aria-label="向下">↓</button>
      <button type="button" data-key="KeyD" aria-label="向右">→</button>
    </div>
  </div>
  <button id="hammer" type="button">按住敲</button>
</div>
<div id="overlay" class="show">
  <div class="card">
    <h1 id="title">守住四扇门</h1>
    <p id="lead">屋子有四个入口。用锤子把木板敲上去，木板有寿命，僵尸砸穿以后就会进来。你的目标是活下去。</p>
    <p id="stats"></p>
    <ul id="help">
      <li>WASD 或左下角方向键移动，鼠标瞄准</li>
      <li>按住空格、右键，或右下角「按住敲」，把木板钉回去</li>
      <li>一块板要敲三下。补过的板会一次比一次脆</li>
      <li>左键开枪，拦住门口的僵尸</li>
    </ul>
    <button id="action" type="button">开始守门</button>
  </div>
</div>
<script>
(function () {
  "use strict";

  var HW = 220;
  var HH = 168;
  var WALL = 26;
  var DOOR_HALF = 46;
  var YARD_X = 470;
  var YARD_Y = 380;
  var PLAYER_R = 12;
  var ZOMBIE_R = 13;

  var DEFS = [
    { name: "北门", nx: 0, ny: -1, x: 0, y: -HH },
    { name: "东门", nx: 1, ny: 0, x: HW, y: 0 },
    { name: "南门", nx: 0, ny: 1, x: 0, y: HH },
    { name: "西门", nx: -1, ny: 0, x: -HW, y: 0 }
  ];

  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var titleEl = document.getElementById("title");
  var leadEl = document.getElementById("lead");
  var statsEl = document.getElementById("stats");
  var helpEl = document.getElementById("help");
  var actionEl = document.getElementById("action");
  var controlsEl = document.getElementById("hud-controls");

  var keys = {};
  var mouse = { x: 0, y: 0, left: false, right: false, worldX: 0, worldY: 0 };
  var mode = "title";
  var doors = [];
  var zombies = [];
  var bullets = [];
  var particles = [];
  var floaters = [];
  var stains = [];
  var player = null;
  var survival = 0;
  var kills = 0;
  var shake = 0;
  var banner = "";
  var bannerT = 0;
  var spawnIn = 1.6;
  var houseOverrun = false;
  var aim = 0;
  var hammerTarget = null;
  var viewScale = 1;
  var decor = [];
  var actx = null;
  var droneOn = false;
  var last = 0;

  function rand(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function buildDecor() {
    decor = [];
    var i;
    for (i = 0; i < 36; i++) {
      var x = (rand(i + 1) * 2 - 1) * (YARD_X - 20);
      var y = (rand(i + 40) * 2 - 1) * (YARD_Y - 20);
      if (Math.abs(x) < HW + 40 && Math.abs(y) < HH + 40) continue;
      decor.push({
        x: x,
        y: y,
        r: 4 + rand(i + 80) * 10,
        rock: rand(i + 7) > 0.55
      });
    }
  }

  function makeDoor(def) {
    return {
      name: def.name,
      nx: def.nx,
      ny: def.ny,
      x: def.x,
      y: def.y,
      boards: [
        { life: 96, max: 96, gen: 0 },
        { life: 96, max: 96, gen: 0 },
        { life: 96, max: 96, gen: 0 }
      ],
      shake: 0,
      wasOpen: false,
      alarm: 0
    };
  }

  function isOpen(door) {
    var i;
    for (i = 0; i < door.boards.length; i++) {
      if (door.boards[i].life > 0) return false;
    }
    return true;
  }

  function integrity(door) {
    var life = 0;
    var max = 0;
    var i;
    for (i = 0; i < door.boards.length; i++) {
      life += door.boards[i].life;
      max += door.boards[i].max;
    }
    return max > 0 ? life / max : 0;
  }

  function wearOf(door) {
    var g = 0;
    var i;
    for (i = 0; i < door.boards.length; i++) g += door.boards[i].gen;
    return Math.min(1, g / (door.boards.length * 4));
  }

  function intactCount(door) {
    var n = 0;
    var i;
    for (i = 0; i < door.boards.length; i++) if (door.boards[i].life > 0) n++;
    return n;
  }

  function canRepair(door) {
    var i;
    for (i = 0; i < door.boards.length; i++) {
      if (door.boards[i].life < door.boards[i].max) return true;
    }
    return false;
  }

  function wave() {
    return 1 + Math.floor(survival / 28) + Math.floor(kills / 8);
  }

  function boardDamage() {
    return 11 + (wave() - 1) * 4;
  }

  function fmt(t) {
    var s = Math.max(0, Math.floor(t));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function bestTime() {
    try { return parseFloat(localStorage.getItem("hold-doors-best") || "0") || 0; }
    catch (e) { return 0; }
  }

  function saveBest() {
    try {
      if (survival > bestTime()) localStorage.setItem("hold-doors-best", String(survival));
    } catch (e) {}
  }

  function wallRects(blockDoors) {
    var rects = [];
    var L = -HW - WALL;
    var R = HW + WALL;
    var T = -HH - WALL;
    var B = HH + WALL;
    var D = DOOR_HALF;
    function add(x, y, w, h) {
      if (w > 0 && h > 0) rects.push({ x: x, y: y, w: w, h: h });
    }
    add(L, -HH - WALL, -D - L, WALL);
    add(D, -HH - WALL, R - D, WALL);
    add(L, HH, -D - L, WALL);
    add(D, HH, R - D, WALL);
    add(HW, T, WALL, -D - T);
    add(HW, D, WALL, B - D);
    add(L, T, WALL, -D - T);
    add(L, D, WALL, B - D);
    if (blockDoors) {
      var i;
      for (i = 0; i < doors.length; i++) {
        if (isOpen(doors[i])) continue;
        var gap = doorGap(doors[i]);
        add(gap.x, gap.y, gap.w, gap.h);
      }
    }
    return rects;
  }

  function doorGap(door) {
    if (door.nx === 0) {
      return {
        x: -DOOR_HALF,
        y: door.ny < 0 ? -HH - WALL : HH,
        w: DOOR_HALF * 2,
        h: WALL
      };
    }
    return {
      x: door.nx < 0 ? -HW - WALL : HW,
      y: -DOOR_HALF,
      w: WALL,
      h: DOOR_HALF * 2
    };
  }

  function circleRect(cx, cy, r, rect) {
    var px = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    var py = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    var dx = cx - px;
    var dy = cy - py;
    return dx * dx + dy * dy < r * r;
  }

  function blocked(x, y, r) {
    if (Math.abs(x) > YARD_X || Math.abs(y) > YARD_Y) return true;
    var rects = wallRects(true);
    var i;
    for (i = 0; i < rects.length; i++) {
      if (circleRect(x, y, r, rects[i])) return true;
    }
    return false;
  }

  function bulletBlocked(x, y) {
    var rects = wallRects(false);
    var i;
    for (i = 0; i < rects.length; i++) {
      var rect = rects[i];
      if (x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h) return true;
    }
    return Math.abs(x) > YARD_X || Math.abs(y) > YARD_Y;
  }

  function moveBody(body, dx, dy, r) {
    var nx = body.x + dx;
    var ny = body.y + dy;
    if (!blocked(nx, body.y, r)) body.x = nx;
    if (!blocked(body.x, ny, r)) body.y = ny;
  }

  function insideHouse(x, y) {
    return Math.abs(x) < HW - 8 && Math.abs(y) < HH - 8;
  }

  function startAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === "suspended") actx.resume();
    if (droneOn) return;
    droneOn = true;
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = "sine";
    o.frequency.value = 52;
    g.gain.value = 0.018;
    o.connect(g);
    g.connect(actx.destination);
    o.start();
  }

  function tone(freq, dur, type, gain, slide) {
    if (!actx) return;
    var o = actx.createOscillator();
    var g = actx.createGain();
    var t = actx.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function noise(dur, gain, freq) {
    if (!actx) return;
    var length = Math.floor(actx.sampleRate * dur);
    var buffer = actx.createBuffer(1, length, actx.sampleRate);
    var data = buffer.getChannelData(0);
    var i;
    for (i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    var src = actx.createBufferSource();
    src.buffer = buffer;
    var filter = actx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = freq;
    var g = actx.createGain();
    var t = actx.currentTime;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filter);
    filter.connect(g);
    g.connect(actx.destination);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  function sndKnock() {
    noise(0.07, 0.22, 420);
    tone(120, 0.07, "square", 0.045, 55);
  }
  function sndShot() {
    noise(0.05, 0.16, 2200);
    tone(240, 0.05, "square", 0.04, 70);
  }
  function sndCrack() {
    noise(0.18, 0.28, 700);
    tone(160, 0.14, "sawtooth", 0.04, 45);
  }
  function sndHurt() {
    tone(220, 0.12, "sawtooth", 0.05, 70);
  }
  function sndBite() {
    noise(0.1, 0.12, 500);
    tone(90, 0.1, "sawtooth", 0.04, 40);
  }

  function burst(x, y, color, n, speed) {
    var i;
    for (i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = speed * (0.4 + Math.random());
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.35 + Math.random() * 0.3,
        max: 0.55,
        color: color,
        size: 1.5 + Math.random() * 2.5
      });
    }
    if (particles.length > 240) particles.splice(0, particles.length - 240);
  }

  function floater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, life: 0.9, color: color });
    if (floaters.length > 24) floaters.shift();
  }

  function announce(text) {
    banner = text;
    bannerT = 2.1;
  }

  function repair(door, amount) {
    var target = null;
    var i;
    for (i = door.boards.length - 1; i >= 0; i--) {
      if (door.boards[i].life <= 0) {
        target = door.boards[i];
        break;
      }
    }
    if (!target) {
      var lowest = 1e9;
      for (i = 0; i < door.boards.length; i++) {
        var board = door.boards[i];
        if (board.life < board.max && board.life < lowest) {
          lowest = board.life;
          target = board;
        }
      }
    }
    if (!target) return 0;
    var before = target.life;
    var maxBefore = target.max;
    if (target.life <= 0) {
      target.gen += 1;
      target.max = Math.max(48, 96 - target.gen * 12);
      target.life = 0;
    }
    target.life = Math.min(target.max, target.life + amount);
    syncDoors();
    return target.life >= target.max && before < maxBefore ? 2 : 1;
  }

  function hurtDoor(door, amount) {
    var remain = amount;
    var broke = false;
    while (remain > 0) {
      var target = null;
      var i;
      for (i = door.boards.length - 1; i >= 0; i--) {
        if (door.boards[i].life > 0) {
          target = door.boards[i];
          break;
        }
      }
      if (!target) break;
      var spent = Math.min(target.life, remain);
      target.life -= spent;
      remain -= spent;
      if (target.life <= 0) {
        target.life = 0;
        broke = true;
        burst(door.x + door.nx * 8, door.y + door.ny * 8, "#a56b3c", 8, 70);
        floater(door.x, door.y - 16, "裂了", "#e07a45");
      }
    }
    door.shake = 0.28;
    door.alarm = 1;
    if (broke) sndCrack();
    else sndBite();
    syncDoors();
  }

  function syncDoors() {
    var anySealed = false;
    var i;
    for (i = 0; i < doors.length; i++) {
      var door = doors[i];
      var open = isOpen(door);
      if (open !== door.wasOpen) {
        if (open) {
          announce(door.name + "破了");
          shake = Math.max(shake, 9);
          burst(door.x, door.y, "#6b4a30", 14, 90);
        } else {
          announce(door.name + "钉上了");
        }
        door.wasOpen = open;
      }
      if (!open) anySealed = true;
    }
    if (!anySealed && !houseOverrun && survival > 0.2) {
      houseOverrun = true;
      announce("他们进来了");
    }
    if (anySealed) houseOverrun = false;
  }

  function pickHammerDoor() {
    var best = null;
    var bestD = 118;
    var i;
    for (i = 0; i < doors.length; i++) {
      var door = doors[i];
      if (!canRepair(door)) continue;
      var ix = door.x - door.nx * 34;
      var iy = door.y - door.ny * 34;
      var d = Math.hypot(player.x - ix, player.y - iy);
      var center = Math.hypot(player.x - door.x, player.y - door.y);
      var dist = Math.min(d, center);
      if (dist > bestD) continue;
      var to = Math.atan2(door.y - player.y, door.x - player.x);
      var diff = Math.atan2(Math.sin(aim - to), Math.cos(aim - to));
      if (dist < 78 || Math.abs(diff) < 0.95) {
        best = door;
        bestD = dist;
      }
    }
    return best;
  }

  function spawnZombie(door) {
    var tangentX = -door.ny;
    var tangentY = door.nx;
    var lateral = (Math.random() - 0.5) * 180;
    var dist = 200 + Math.random() * 50;
    var z = {
      x: door.x + door.nx * dist + tangentX * lateral,
      y: door.y + door.ny * dist + tangentY * lateral,
      hp: 46 + wave() * 10,
      max: 46 + wave() * 10,
      speed: 52 + wave() * 6 + Math.random() * 18,
      hitCd: 0.3 + Math.random() * 0.4,
      hurt: 0,
      dead: false,
      fade: 0,
      stuck: 0,
      lx: 0,
      ly: 0
    };
    z.x = Math.max(-YARD_X + 16, Math.min(YARD_X - 16, z.x));
    z.y = Math.max(-YARD_Y + 16, Math.min(YARD_Y - 16, z.y));
    z.lx = z.x;
    z.ly = z.y;
    zombies.push(z);
  }

  function damagePlayer(amount, fromX, fromY) {
    if (mode !== "play" || player.inv > 0) return;
    player.hp = Math.max(0, player.hp - amount);
    player.inv = 0.42;
    player.hurt = 1;
    shake = Math.max(shake, 7);
    sndHurt();
    var dx = player.x - fromX;
    var dy = player.y - fromY;
    var len = Math.hypot(dx, dy) || 1;
    var nx = player.x + (dx / len) * 10;
    var ny = player.y + (dy / len) * 10;
    if (!blocked(nx, player.y, PLAYER_R)) player.x = nx;
    if (!blocked(player.x, ny, PLAYER_R)) player.y = ny;
    if (player.hp <= 0) die();
  }

  function die() {
    if (mode !== "play") return;
    mode = "dead";
    player.hp = 0;
    saveBest();
    titleEl.textContent = "没守住";
    leadEl.textContent = "木板断了，门开了，他们进来了。";
    statsEl.hidden = false;
    statsEl.textContent = "存活 " + fmt(survival) + "    击杀 " + kills + "    最佳 " + fmt(bestTime());
    helpEl.hidden = true;
    actionEl.textContent = "再守一次";
    overlay.classList.add("show");
    controlsEl.classList.remove("show");
  }

  function showTitle() {
    mode = "title";
    titleEl.textContent = "守住四扇门";
    leadEl.textContent = "屋子有四个入口。用锤子把木板敲上去，木板有寿命，僵尸砸穿以后就会进来。你的目标是活下去。";
    var best = bestTime();
    statsEl.hidden = best <= 0;
    statsEl.textContent = best > 0 ? "最佳 " + fmt(best) : "";
    helpEl.hidden = false;
    actionEl.textContent = "开始守门";
    overlay.classList.add("show");
    controlsEl.classList.remove("show");
  }

  function reset() {
    doors = DEFS.map(makeDoor);
    zombies = [];
    bullets = [];
    particles = [];
    floaters = [];
    stains = [];
    player = {
      x: 0,
      y: 24,
      hp: 100,
      max: 100,
      inv: 0,
      hurt: 0,
      fireCd: 0,
      hammerCd: 0,
      swing: 0
    };
    survival = 0;
    kills = 0;
    shake = 0;
    banner = "守住四扇门";
    bannerT = 2.4;
    spawnIn = 1.6;
    houseOverrun = false;
    aim = -Math.PI / 2;
    hammerTarget = null;
  }

  function update(dt) {
    survival += dt;
    player.inv = Math.max(0, player.inv - dt);
    player.hurt = Math.max(0, player.hurt - dt * 1.6);
    player.fireCd = Math.max(0, player.fireCd - dt);
    player.hammerCd = Math.max(0, player.hammerCd - dt);
    player.swing = Math.max(0, player.swing - dt * 3.2);
    shake = Math.max(0, shake - dt * 22);
    bannerT = Math.max(0, bannerT - dt);

    var i;
    for (i = 0; i < doors.length; i++) {
      doors[i].shake = Math.max(0, doors[i].shake - dt);
      doors[i].alarm = Math.max(0, doors[i].alarm - dt);
    }

    aim = Math.atan2(mouse.worldY - player.y, mouse.worldX - player.x);
    var ix = 0;
    var iy = 0;
    if (keys.KeyW || keys.ArrowUp) iy -= 1;
    if (keys.KeyS || keys.ArrowDown) iy += 1;
    if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    var len = Math.hypot(ix, iy);
    if (len > 0) {
      var speed = 168;
      moveBody(player, (ix / len) * speed * dt, (iy / len) * speed * dt, PLAYER_R);
    }

    hammerTarget = pickHammerDoor();
    var hammering = keys.Space || keys.KeyE || mouse.right;
    if (hammering && hammerTarget && player.hammerCd <= 0) {
      var result = repair(hammerTarget, 32);
      player.hammerCd = 0.33;
      player.swing = 1;
      shake = Math.max(shake, 3.5);
      sndKnock();
      burst(hammerTarget.x - hammerTarget.nx * 10, hammerTarget.y - hammerTarget.ny * 10, "#c4956a", 5, 60);
      if (result === 2) {
        var frail = false;
        for (i = 0; i < hammerTarget.boards.length; i++) {
          if (hammerTarget.boards[i].gen >= 3) frail = true;
        }
        floater(hammerTarget.x, hammerTarget.y - 20, frail ? "变脆了" : "钉上", frail ? "#e0a15a" : "#d5e38a");
      }
    }

    if (mouse.left && player.fireCd <= 0 && player.swing < 0.2) {
      player.fireCd = 0.22;
      shake = Math.max(shake, 2);
      sndShot();
      bullets.push({
        x: player.x + Math.cos(aim) * 16,
        y: player.y + Math.sin(aim) * 16,
        vx: Math.cos(aim) * 680,
        vy: Math.sin(aim) * 680,
        life: 0.48
      });
    }

    var w = wave();
    var cap = Math.min(16, 4 + w * 2);
    spawnIn -= dt;
    var alive = 0;
    for (i = 0; i < zombies.length; i++) if (!zombies[i].dead) alive++;
    if (spawnIn <= 0 && alive < cap) {
      spawnIn = Math.max(0.48, 2.15 - w * 0.16);
      var door = doors[Math.floor(Math.random() * doors.length)];
      if (Math.random() < 0.45) {
        var weak = door;
        var weakLife = 2;
        for (i = 0; i < doors.length; i++) {
          var life = integrity(doors[i]);
          if (life < weakLife) {
            weakLife = life;
            weak = doors[i];
          }
        }
        door = weak;
      }
      spawnZombie(door);
    }

    for (i = zombies.length - 1; i >= 0; i--) {
      var z = zombies[i];
      z.hurt = Math.max(0, z.hurt - dt * 3);
      if (z.dead) {
        z.fade -= dt;
        if (z.fade <= 0) zombies.splice(i, 1);
        continue;
      }
      var order = think(z);
      z.hitCd -= dt;
      var holding = false;
      if (order.mode === "bash") {
        var ax = order.door.x + order.door.nx * (WALL + 18);
        var ay = order.door.y + order.door.ny * (WALL + 18);
        var dd = Math.hypot(z.x - order.door.x, z.y - order.door.y);
        var gd = Math.hypot(z.x - ax, z.y - ay);
        if (gd > 22 && dd > 70) steer(z, ax, ay, dt);
        else {
          holding = true;
          if (z.hitCd <= 0) {
            z.hitCd = 0.78 + Math.random() * 0.2;
            hurtDoor(order.door, boardDamage());
            order.door.alarm = 1;
          }
        }
      } else if (order.mode === "enter") {
        if (!insideHouse(z.x, z.y)) {
          steer(z, order.door.x - order.door.nx * 36, order.door.y - order.door.ny * 36, dt);
        } else {
          chase(z, dt);
          if (Math.hypot(player.x - z.x, player.y - z.y) < 26) holding = true;
        }
      } else {
        chase(z, dt);
        if (Math.hypot(player.x - z.x, player.y - z.y) < 26) holding = true;
      }
      var moved = Math.hypot(z.x - z.lx, z.y - z.ly);
      if (!holding && moved < 6 * dt) z.stuck += dt;
      else z.stuck = 0;
      z.lx = z.x;
      z.ly = z.y;
      if (z.stuck > 0.7) {
        z.stuck = 0;
        var side = Math.random() < 0.5 ? 1 : -1;
        var sx = -order.ny * 18 * side || (Math.random() - 0.5) * 24;
        var sy = order.nx * 18 * side || (Math.random() - 0.5) * 24;
        if (!order.nx && !order.ny) {
          sx = (Math.random() - 0.5) * 30;
          sy = (Math.random() - 0.5) * 30;
        }
        if (!blocked(z.x + sx, z.y, ZOMBIE_R)) z.x += sx;
        if (!blocked(z.x, z.y + sy, ZOMBIE_R)) z.y += sy;
      }
    }

    for (i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      var hit = false;
      var j;
      for (j = 0; j < zombies.length; j++) {
        var zombie = zombies[j];
        if (zombie.dead) continue;
        if (Math.hypot(b.x - zombie.x, b.y - zombie.y) < ZOMBIE_R + 3) {
          zombie.hp -= 22;
          zombie.hurt = 1;
          burst(zombie.x, zombie.y, "#6e1c16", 5, 50);
          floater(zombie.x, zombie.y - 18, "22", "#f0e2cf");
          if (zombie.hp <= 0) {
            zombie.dead = true;
            zombie.fade = 0.45;
            kills += 1;
            stains.push({ x: zombie.x, y: zombie.y, r: 10 + Math.random() * 6 });
            if (stains.length > 40) stains.shift();
            burst(zombie.x, zombie.y, "#7a2018", 10, 80);
            floater(zombie.x, zombie.y - 22, "击倒", "#f0a090");
          }
          hit = true;
          break;
        }
      }
      if (!hit && bulletBlocked(b.x, b.y)) hit = true;
      if (hit || b.life <= 0) bullets.splice(i, 1);
    }

    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 20 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (i = floaters.length - 1; i >= 0; i--) {
      floaters[i].y -= 28 * dt;
      floaters[i].life -= dt;
      if (floaters[i].life <= 0) floaters.splice(i, 1);
    }
  }

  function think(z) {
    if (insideHouse(z.x, z.y)) return { mode: "chase", nx: 0, ny: 0 };
    var sealed = null;
    var open = null;
    var sealedD = 1e9;
    var openD = 1e9;
    var i;
    for (i = 0; i < doors.length; i++) {
      var door = doors[i];
      var d = Math.hypot(z.x - door.x, z.y - door.y);
      var outside = (z.x - door.x) * door.nx + (z.y - door.y) * door.ny > 16;
      if (!outside && d > 100) continue;
      if (isOpen(door)) {
        if (d < openD) {
          openD = d;
          open = door;
        }
      } else if (d < sealedD) {
        sealedD = d;
        sealed = door;
      }
    }
    if (open && !(sealed && sealedD + 120 < openD)) return { mode: "enter", door: open, nx: open.nx, ny: open.ny };
    if (sealed) return { mode: "bash", door: sealed, nx: sealed.nx, ny: sealed.ny };
    return { mode: "chase", nx: 0, ny: 0 };
  }

  function steer(z, tx, ty, dt) {
    var dx = tx - z.x;
    var dy = ty - z.y;
    var i;
    for (i = 0; i < zombies.length; i++) {
      var o = zombies[i];
      if (o === z || o.dead) continue;
      var ox = z.x - o.x;
      var oy = z.y - o.y;
      var d = Math.hypot(ox, oy);
      if (d > 0 && d < 30) {
        dx += (ox / d) * 22;
        dy += (oy / d) * 22;
      }
    }
    var len = Math.hypot(dx, dy) || 1;
    moveBody(z, (dx / len) * z.speed * dt, (dy / len) * z.speed * dt, ZOMBIE_R);
    z.face = Math.atan2(dy, dx);
  }

  function chase(z, dt) {
    var d = Math.hypot(player.x - z.x, player.y - z.y);
    if (d < 26) {
      if (z.hitCd <= 0) {
        z.hitCd = 0.9;
        damagePlayer(8 + Math.floor(wave() / 2), z.x, z.y);
        sndBite();
      }
      z.face = Math.atan2(player.y - z.y, player.x - z.x);
      return;
    }
    steer(z, player.x, player.y, dt);
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(window.innerWidth * dpr));
    canvas.height = Math.max(1, Math.floor(window.innerHeight * dpr));
    viewScale = Math.min((canvas.width - 80 * dpr) / 1040, (canvas.height - 80 * dpr) / 820);
  }

  function eventWorld(e) {
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) * (canvas.width / rect.width);
    var y = (e.clientY - rect.top) * (canvas.height / rect.height);
    mouse.worldX = (x - canvas.width / 2) / viewScale;
    mouse.worldY = (y - canvas.height / 2) / viewScale;
  }

  function drawWorld() {
    var dpr = window.devicePixelRatio || 1;
    var sx = (Math.random() - 0.5) * shake * viewScale;
    var sy = (Math.random() - 0.5) * shake * viewScale;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#12100e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(viewScale, 0, 0, viewScale, canvas.width / 2 + sx, canvas.height / 2 + sy);

    ctx.fillStyle = "#241f18";
    ctx.fillRect(-YARD_X, -YARD_Y, YARD_X * 2, YARD_Y * 2);
    var i;
    for (i = 0; i < decor.length; i++) {
      var d = decor[i];
      ctx.fillStyle = d.rock ? "#3a342c" : "#1b2418";
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "#4e3828";
    ctx.fillRect(-HW, -HH, HW * 2, HH * 2);
    ctx.strokeStyle = "rgba(90, 60, 36, 0.45)";
    ctx.lineWidth = 1;
    for (i = -HH; i <= HH; i += 14) {
      ctx.beginPath();
      ctx.moveTo(-HW, i);
      ctx.lineTo(HW, i);
      ctx.stroke();
    }
    var glow = ctx.createRadialGradient(0, 10, 20, 0, 10, 260);
    glow.addColorStop(0, "rgba(255, 196, 120, 0.16)");
    glow.addColorStop(1, "rgba(255, 196, 120, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(-HW, -HH, HW * 2, HH * 2);

    for (i = 0; i < stains.length; i++) {
      ctx.fillStyle = "rgba(90, 16, 12, 0.55)";
      ctx.beginPath();
      ctx.arc(stains[i].x, stains[i].y, stains[i].r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (i = 0; i < doors.length; i++) {
      var gap = doorGap(doors[i]);
      ctx.fillStyle = isOpen(doors[i]) ? "#1a120e" : "#100e0c";
      ctx.fillRect(gap.x, gap.y, gap.w, gap.h);
    }

    ctx.fillStyle = "#5b4a3e";
    ctx.strokeStyle = "#1a1410";
    ctx.lineWidth = 2;
    var rects = wallRects(false);
    for (i = 0; i < rects.length; i++) {
      ctx.fillRect(rects[i].x, rects[i].y, rects[i].w, rects[i].h);
      ctx.strokeRect(rects[i].x, rects[i].y, rects[i].w, rects[i].h);
    }

    if (player) {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(aim);
      var beam = ctx.createRadialGradient(30, 0, 8, 160, 0, 210);
      beam.addColorStop(0, "rgba(255, 214, 150, 0.16)");
      beam.addColorStop(1, "rgba(255, 214, 150, 0)");
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 230, -0.42, 0.42);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    for (i = 0; i < doors.length; i++) drawDoor(doors[i], doors[i] === hammerTarget);

    var drawList = zombies.slice();
    if (player) drawList.push(player);
    drawList.sort(function (a, b) { return a.y - b.y; });
    for (i = 0; i < drawList.length; i++) {
      if (drawList[i] === player) drawPlayer();
      else drawZombie(drawList[i]);
    }

    for (i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.strokeStyle = "#ffe3a4";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02);
      ctx.stroke();
    }

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.globalAlpha = 1;
    }

    ctx.font = "14px WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif";
    ctx.textAlign = "center";
    for (i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      ctx.globalAlpha = Math.max(0, f.life / 0.9);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (player && player.hurt > 0) {
      ctx.fillStyle = "rgba(120, 16, 12, " + (player.hurt * 0.28) + ")";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    var vg = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.height * 0.35, canvas.width / 2, canvas.height / 2, canvas.height * 0.72);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.38)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawDoor(door, hot) {
    var tangentX = -door.ny;
    var tangentY = door.nx;
    var jolt = Math.sin(door.shake * 70) * door.shake * 10;
    var i;
    if (hot) {
      ctx.strokeStyle = "rgba(226, 161, 75, 0.95)";
      ctx.lineWidth = 2;
      ctx.strokeRect(doorGap(door).x - 3, doorGap(door).y - 3, doorGap(door).w + 6, doorGap(door).h + 6);
    }
    for (i = 0; i < door.boards.length; i++) {
      var board = door.boards[i];
      if (board.life <= 0) continue;
      var p = board.max > 0 ? board.life / board.max : 0;
      var across = (i - 1) * 7;
      var span = (DOOR_HALF * 2 - 14) * (0.62 + 0.38 * p);
      var cx = door.x + door.nx * (across + jolt);
      var cy = door.y + door.ny * (across + jolt);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.atan2(tangentY, tangentX));
      ctx.rotate((1 - p) * 0.18 * (i % 2 ? 1 : -1));
      var red = Math.floor(92 + p * 78 - wearOf(door) * 20);
      ctx.fillStyle = "rgb(" + red + "," + Math.floor(58 + p * 36) + ",32)";
      ctx.fillRect(-span / 2, -3.2, span, 6.4);
      ctx.fillStyle = "#d9d3cc";
      ctx.fillRect(-span / 2 + 4, -1, 2, 2);
      ctx.fillRect(span / 2 - 6, -1, 2, 2);
      ctx.restore();
    }
  }

  function drawZombie(z) {
    ctx.save();
    ctx.translate(z.x, z.y);
    ctx.globalAlpha = z.dead ? Math.max(0, z.fade / 0.45) : 1;
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath();
    ctx.ellipse(0, 8, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = z.hurt > 0.4 ? "#d7d2c4" : "#74825d";
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#1a1612";
    ctx.stroke();
    ctx.fillStyle = "#d7deC4";
    ctx.beginPath();
    ctx.arc(Math.cos(z.face || 0) * 4, Math.sin(z.face || 0) * 4 - 2, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#c0392b";
    ctx.fillRect(Math.cos(z.face || 0) * 6 - 1, Math.sin(z.face || 0) * 6 - 3, 2, 2);
    if (!z.dead && z.hp < z.max) {
      ctx.fillStyle = "#1a120e";
      ctx.fillRect(-12, -18, 24, 3);
      ctx.fillStyle = "#9a2e24";
      ctx.fillRect(-12, -18, 24 * Math.max(0, z.hp / z.max), 3);
    }
    ctx.restore();
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(0, 9, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.rotate(aim);
    ctx.fillStyle = "#8c3b2b";
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ead7bf";
    ctx.beginPath();
    ctx.arc(7, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    if (player.swing > 0) {
      var ang = -1.1 + (1 - player.swing) * 2.1;
      ctx.save();
      ctx.rotate(ang);
      ctx.strokeStyle = "#f0e2cf";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(22, 0);
      ctx.stroke();
      ctx.fillStyle = "#9aa0a8";
      ctx.fillRect(20, -6, 8, 12);
      ctx.restore();
    } else {
      ctx.fillStyle = "#2b2926";
      ctx.fillRect(8, -2, 14, 4);
    }
    ctx.restore();
  }

  function drawHud() {
    if (!player) return;
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = (15 * dpr) + "px WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif";
    var margin = 18 * dpr;
    var lines = [
      "存活  " + fmt(survival),
      "第 " + wave() + " 波",
      "击杀  " + kills
    ];
    var i;
    for (i = 0; i < lines.length; i++) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillText(lines[i], margin + 1, margin + i * 22 * dpr + 1);
      ctx.fillStyle = "#f3e6d4";
      ctx.fillText(lines[i], margin, margin + i * 22 * dpr);
    }

    var barW = 168 * dpr;
    var barH = 10 * dpr;
    var hx = margin;
    var hy = margin + lines.length * 22 * dpr + 6 * dpr;
    ctx.fillStyle = "#f3e6d4";
    ctx.font = (13 * dpr) + "px WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif";
    ctx.fillText("生命", hx, hy);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(hx, hy + 18 * dpr, barW, barH);
    ctx.fillStyle = player.hp < 35 ? "#9a2e24" : "#8c3b2b";
    ctx.fillRect(hx, hy + 18 * dpr, barW * (player.hp / player.max), barH);

    var spots = [
      { door: doors[0], x: canvas.width / 2 - 70 * dpr, y: margin },
      { door: doors[1], x: canvas.width - margin - 150 * dpr, y: canvas.height / 2 - 30 * dpr },
      { door: doors[2], x: canvas.width / 2 - 70 * dpr, y: canvas.height - margin - 92 * dpr },
      { door: doors[3], x: margin, y: canvas.height / 2 - 30 * dpr }
    ];
    for (i = 0; i < spots.length; i++) drawDoorHud(spots[i].door, spots[i].x, spots[i].y, dpr);

    ctx.textAlign = "center";
    var prompt = "空格 / 右键 敲木板     左键 开枪";
    if (hammerTarget) {
      prompt = "敲 " + hammerTarget.name + "   " + Math.round(integrity(hammerTarget) * 100) + "%";
    }
    ctx.font = (15 * dpr) + "px WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif";
    ctx.fillStyle = hammerTarget ? "#e2a14b" : "rgba(243,230,212,0.8)";
    ctx.fillText(prompt, canvas.width / 2, canvas.height - margin - 8 * dpr);

    if (bannerT > 0) {
      ctx.globalAlpha = Math.min(1, bannerT);
      ctx.font = (28 * dpr) + "px WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif";
      ctx.fillStyle = "#f0d7a4";
      ctx.fillText(banner, canvas.width / 2, canvas.height * 0.16);
      ctx.globalAlpha = 1;
    }
  }

  function drawDoorHud(door, x, y, dpr) {
    if (!door) return;
    var open = isOpen(door);
    var pulse = open || door.alarm > 0 ? 0.65 + 0.35 * Math.sin(performance.now() / 120) : 1;
    ctx.globalAlpha = pulse;
    ctx.textAlign = "left";
    ctx.font = (14 * dpr) + "px WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif";
    var label = open ? door.name + "  破了" : door.name + "  " + intactCount(door) + "/3";
    ctx.fillStyle = open ? "#e07a6a" : "#f3e6d4";
    ctx.fillText(label, x, y);
    var w = 132 * dpr;
    var h = 8 * dpr;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(x, y + 18 * dpr, w, h);
    var life = integrity(door);
    var color = life > 0.66 ? "#6f8f4e" : life > 0.33 ? "#c4883a" : "#9a2e24";
    if (wearOf(door) > 0.35 && life > 0.66) color = "#8a6238";
    ctx.fillStyle = color;
    ctx.fillRect(x, y + 18 * dpr, w * (open ? 0 : life), h);
    var i;
    for (i = 0; i < 3; i++) {
      var board = door.boards[i];
      var p = board.max > 0 ? board.life / board.max : 0;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(x + i * 16 * dpr, y + 30 * dpr, 12 * dpr, 6 * dpr);
      ctx.fillStyle = color;
      ctx.fillRect(x + i * 16 * dpr, y + 30 * dpr, 12 * dpr * p, 6 * dpr);
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (mode === "play") update(dt);
    drawWorld();
    if (mode === "play" || mode === "dead") drawHud();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () {
    keys = {};
    mouse.left = false;
    mouse.right = false;
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  canvas.addEventListener("mousemove", eventWorld);
  canvas.addEventListener("mousedown", function (e) {
    eventWorld(e);
    if (e.button === 0) mouse.left = true;
    if (e.button === 2) mouse.right = true;
    canvas.focus();
  });
  window.addEventListener("mouseup", function (e) {
    if (e.button === 0) mouse.left = false;
    if (e.button === 2) mouse.right = false;
  });

  function bindHold(el, down, up) {
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      down();
    });
    el.addEventListener("pointerup", up);
    el.addEventListener("pointerleave", up);
    el.addEventListener("pointercancel", up);
  }
  Array.prototype.forEach.call(document.querySelectorAll("#pad button"), function (btn) {
    bindHold(btn, function () { keys[btn.getAttribute("data-key")] = true; }, function () {
      keys[btn.getAttribute("data-key")] = false;
    });
  });
  bindHold(document.getElementById("hammer"), function () { mouse.right = true; }, function () { mouse.right = false; });

  actionEl.addEventListener("click", function () {
    startAudio();
    reset();
    mode = "play";
    overlay.classList.remove("show");
    controlsEl.classList.add("show");
    canvas.focus();
  });

  buildDecor();
  reset();
  showTitle();
  resize();
  requestAnimationFrame(frame);

  window.__game = {
    snapshot: function () {
      return {
        mode: mode,
        survival: survival,
        kills: kills,
        x: player ? player.x : 0,
        y: player ? player.y : 0,
        hp: player ? player.hp : 0,
        zombies: zombies.filter(function (z) { return !z.dead; }).length,
        inside: zombies.filter(function (z) {
          return !z.dead && Math.abs(z.x) < HW - 8 && Math.abs(z.y) < HH - 8;
        }).length,
        doors: doors.map(function (door) {
          return {
            name: door.name,
            open: isOpen(door),
            integrity: integrity(door),
            boards: door.boards.map(function (b) { return { life: b.life, max: b.max, gen: b.gen }; })
          };
        })
      };
    },
    hurtDoor: function (index, amount) { hurtDoor(doors[index], amount); },
    place: function (x, y) {
      player.x = x;
      player.y = y;
    },
    hitPlayer: function (amount) {
      damagePlayer(amount || 100, player.x, player.y + 40);
    }
  };
})();
</script>
</body>
</html>
